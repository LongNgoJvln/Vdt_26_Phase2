# Alembic configuration for the multi-tenant Postgres backend.
#
# The migration live in ./alembic and target the SQLAlchemy models in
# core/database.py. The actual connection URL is sourced from the
# environment (DATABASE_URL) inside alembic/env.py — the value here is a
# placeholder so `alembic` CLI calls work without the env var set.
#
# To roll out the multi-tenant backend:
#   1. Set DATABASE_URL=postgresql+psycopg://user:pass@host:5432/odysseus
#   2. Set ODYSSEUS_MULTITENANT_POSTGRES=true
#   3. Start the app — init_db() runs `alembic upgrade head` under an
#      advisory lock so concurrent workers converge on a single migrator.

[alembic]
script_location = alembic
prepend_sys_path = .
# placeholder; env.py overrides with DATABASE_URL when present
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
