apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hw5gai
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: 5g-agentic-ai
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: psql
      port: 5432
      targetPort: 5432
      nodePort: 31432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: hw5gai
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: 5g-agentic-ai
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      imagePullSecrets:
        - name: harbor-pull
      # Hard node affinity — pin to host 10.55.110.122. Label must be set on
      # the node once: kubectl label node <name> vht.vn/node-ip=10.55.110.122
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: vht.vn/node-ip
                    operator: In
                    values:
                      - "10.55.110.122"
      containers:
        - name: postgres
          image: 172.20.1.22/proxy-cache/library/postgres:16
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: app-env
          # Only the three POSTGRES_* vars are read by the entrypoint of
          # the postgres image; DATABASE_URL and the rest in app-env are
          # ignored here and consumed by networkchange.
          ports:
            - containerPort: 5432
              name: psql
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
