apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: hw5gai
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: 5g-agentic-ai
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ntfy
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: hw5gai
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: 5g-agentic-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
    spec:
      imagePullSecrets:
        - name: harbor-pull
      # Hard node affinity — pin to host 10.55.110.122. Label must be set on
      # the node once: kubectl label node <name> vht.vn/node-ip=10.55.110.122
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: vht.vn/node-ip
                    operator: In
                    values:
                      - "10.55.110.122"
      containers:
        - name: ntfy
          image: 172.20.1.22/proxy-cache/binwiederhier/ntfy
          imagePullPolicy: IfNotPresent
          command: ["serve"]
          envFrom:
            - secretRef:
                name: app-env
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ntfy
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: ntfy-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-cache
  namespace: hw5gai
  labels:
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: 5g-agentic-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
